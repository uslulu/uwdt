name: Check

# Быстрая проверка пушей и PR: тесты + компиляция всех платформ.
# Релизные сборки и публикация — в release.yml (по тегу v*).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.14.0'

jobs:
  test-and-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend tests
        run: cd frontend && npx vitest run

      - name: Go tests
        run: go test ./backend/ ./tests/

      # Windows собирается обычным go build с syso из scripts/windows-resources.json;
      # wails build добавляет второй .rsrc и линковка падает.
      - name: Compile Windows (cross)
        run: |
          go install github.com/tc-hib/go-winres@latest
          "$(go env GOPATH)/bin/go-winres" make \
            --in scripts/windows-resources.json \
            --out rsrc --arch amd64 \
            --product-version 0.0.0.0 --file-version 0.0.0.0
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags "-H windowsgui" -o /tmp/UWDT.exe .
          git checkout -- rsrc_windows_amd64.syso

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build macOS
        run: "$(go env GOPATH)/bin/wails build -platform darwin/arm64"
