name: Release

# Запускается вручную на теге vX.Y.Z с выбранной платформой.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Платформа релиза
        type: choice
        options: [macos, windows, both]
        required: true
        default: both

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.14.0'

jobs:
  windows:
    if: inputs.platform != 'macos'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Resolve version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Манифест и иконка: генерируем syso из scripts/windows-resources.json,
      # версия — из тега. Wails build не используем: он добавляет свой .rsrc
      # и линковка падает с «too many .rsrc sections». Тег production обязателен:
      # без него Wails на старте показывает диалог про build tags.
      - name: Embed Windows manifest and icon
        run: |
          go install github.com/tc-hib/go-winres@latest
          "$(go env GOPATH)/bin/go-winres" make \
            --in scripts/windows-resources.json \
            --out rsrc --arch amd64 \
            --product-version "${{ steps.ver.outputs.version }}.0" \
            --file-version "${{ steps.ver.outputs.version }}.0"

      - name: Build UWDT.exe
        run: |
          mkdir -p build/bin.noindex
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -tags production -ldflags "-H windowsgui -X pwdtt/backend.Version=${{ steps.ver.outputs.version }}" -o build/bin.noindex/UWDT.exe .

      - name: Zip UWDT-windows-amd64.zip
        run: |
          cd build/bin.noindex
          zip UWDT-windows-amd64.zip UWDT.exe

      # Установщик NSIS: без UTF-8 локали makensis не читает кириллицу в uwdt.nsi
      - name: Build NSIS installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis locales
          sudo locale-gen en_US.UTF-8
          LC_ALL=en_US.UTF-8 makensis -INPUTCHARSET UTF8 \
            -DVERSION=${{ steps.ver.outputs.version }} \
            build/windows/installer/uwdt.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/bin.noindex/UWDT-windows-amd64.zip
            build/bin.noindex/UWDT-setup-windows-amd64.exe
          retention-days: 7

  macos:
    if: inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build UWDT.app
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers

        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          "$(go env GOPATH)/bin/wails" build -platform darwin/arm64 -ldflags "-X pwdtt/backend.Version=$V"
          codesign --force --deep --sign - build/bin/PWDTT.app
          codesign --verify --deep --strict build/bin/PWDTT.app

      # Бандл называется по wails.json (PWDTT.app) — переименовываем в UWDT.app
      - name: Zip UWDT-macos-arm64.zip
        run: |
          cd build/bin
          mv PWDTT.app UWDT.app
          ditto -c -k --sequesterRsrc --keepParent UWDT.app UWDT-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bin/UWDT-macos-arm64.zip
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/UWDT-*
