<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="1" stop-color="#1f63e6"/>
    </linearGradient>
    <radialGradient id="glass" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0b3fa8" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#3d8dff"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="512" cy="512" r="300"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#06215e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS: плитка 824×824 с отступом 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="300" fill="url(#glass)"/>
    <g clip-path="url(#ball)">
      <path d="M150 540 Q 225 505 300 540 T 450 540 T 600 540 T 750 540 T 900 540 V 900 H 150 Z" fill="url(#water)" opacity="0.55"/>
      <path d="M150 565 Q 225 600 300 565 T 450 565 T 600 565 T 750 565 T 900 565 V 900 H 150 Z" fill="url(#water)"/>
    </g>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="8"/>
    <ellipse cx="408" cy="352" rx="92" ry="44" transform="rotate(-32 408 352)" fill="#ffffff" opacity="0.85"/>
    <circle cx="660" cy="672" r="16" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- маленькие пузырьки -->
  <circle cx="790" cy="250" r="26" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="232" cy="790" r="18" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
  <circle cx="820" cy="770" r="11" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
</svg>
